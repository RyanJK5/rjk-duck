name: Claude Code Review

# Reviews a PR on request: a maintainer comments "/claude-review" on the PR.
#
# This is an issue_comment trigger, not pull_request, so it runs in this repo's
# context and has access to CLAUDE_CODE_OAUTH_TOKEN even for PRs from forks.
# The review only reads the code and posts inline comments; it never builds or
# runs the PR.

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/claude-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}'
          # The review command launches subagents and reads files; without these
          # tools it can't review anything and just reports "No issues found".
          # Its gh commands are allowed by the plugin itself.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Agent,Task,Read,Grep,Glob"'
